version: "3"

vars:
  GREETING: Hello, AI Commit!

dotenv:
  - .env

tasks:
  default:
    desc: print all alailable tasks
    cmd: task --list-all
  
  prod:
    desc: build with repease and move to /opt/bin
    env:
       RUSTFLAGS: "-C target-cpu=native"
    cmds:
      - cargo build -r
      - cp /tmp/.cargo/target/release/ai-commit /opt/bin/ai-commit
  clippy:
    desc: fmt and clippy for rust codes
    cmds:
      - cargo fmt
      - cargo clippy --all-targets
